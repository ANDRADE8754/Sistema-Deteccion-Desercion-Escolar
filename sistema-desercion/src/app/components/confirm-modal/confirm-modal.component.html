<div class="modal-overlay" *ngIf="isOpen">
  <div class="modal-dialog">
    <div class="modal-icon">
      <span class="material-symbols-rounded" style="font-size: 3rem; color: #f59e0b;">warning</span>
    </div>
    <h3 class="modal-title">{{ titulo }}</h3>
    <p class="modal-message">{{ mensaje }}</p>
    <div class="modal-actions">
      <button class="btn btn--secundario" (click)="onCancelar()">Cancelar</button>
      <button class="btn btn--peligro" (click)="onConfirmar()">{{ textoConfirmar }}</button>
    </div>
  </div>
</div>
