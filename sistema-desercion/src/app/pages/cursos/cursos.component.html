<div class="cursos-page">

  <div class="page-header">
    <h1>Cursos registrados</h1>
    <button class="btn btn--primario" (click)="mostrarFormulario = !mostrarFormulario">
      {{ mostrarFormulario ? 'Cancelar' : '+ Nuevo curso' }}
    </button>
  </div>

  <!--
    *ngIf muestra u oculta este bloque según el valor de mostrarFormulario.
    Angular elimina el elemento del DOM cuando es false (no solo lo oculta con CSS).
  -->
  <div class="formulario-card" *ngIf="mostrarFormulario">
    <h2>Nuevo curso</h2>

    <div class="campo">
      <label for="nombre">Nombre del curso *</label>
      <!--
        [(ngModel)] es two-way data binding:
        - [ngModel] muestra el valor de nuevoCurso.nombre en el input
        - (ngModel) actualiza nuevoCurso.nombre cuando el usuario escribe
        Es el equivalente a value + onChange en React.
      -->
      <input
        id="nombre"
        type="text"
        [(ngModel)]="nuevoCurso.nombre"
        placeholder="Ej: 4to Grado A"
      />
    </div>

    <div class="campo">
      <label for="descripcion">Descripción</label>
      <input
        id="descripcion"
        type="text"
        [(ngModel)]="nuevoCurso.descripcion"
        placeholder="Ej: Escuela Rural Nro 45"
      />
    </div>

    <!-- (click) escucha el evento click y llama al método guardarCurso() -->
    <button class="btn btn--primario" (click)="guardarCurso()">Guardar curso</button>
  </div>

  <!-- *ngIf con else: si no hay cursos muestra el bloque #sinCursos -->
  <div *ngIf="cursos.length > 0; else sinCursos">
    <!--
      *ngFor itera el array cursos y crea un div por cada elemento.
      trackBy es una optimización: Angular usa el id para identificar
      qué elementos cambiaron, evitando re-renderizar toda la lista.
    -->
    <div
      class="curso-card"
      *ngFor="let curso of cursos; trackBy: trackById"
      (click)="verEstudiantes(curso.id)"
    >
      <div class="curso-card__info">
        <h3>{{ curso.nombre }}</h3>
        <p>{{ curso.descripcion }}</p>
      </div>
      <div class="curso-card__acciones">
        <span class="curso-card__flecha">Ver estudiantes →</span>
        <button
          class="btn btn--peligro btn--pequeno"
          (click)="eliminarCurso(curso.id, $event)"
        >
          Eliminar
        </button>
      </div>
    </div>
  </div>

  <!-- Template de referencia para el else del *ngIf -->
  <ng-template #sinCursos>
    <div class="estado-vacio">
      <p>No hay cursos registrados.</p>
      <p>Crea el primero con el botón de arriba.</p>
    </div>
  </ng-template>

</div>
